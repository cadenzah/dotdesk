# VERSION 파일이 바뀐 채로 main에 올라오면 DotDesk.app을 빌드해서
# GitHub Release(v<버전>)에 zip으로 올려요. 이미 있는 버전이면 건너뛰어요.
# 릴리스 노트는 scripts/release-notes.sh가 이전 릴리스 이후 커밋 접두어로 만들어요.
# 이미 있는 버전에서 손으로 실행(workflow_dispatch)하면 노트만 다시 만들어 고쳐요.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 이전 릴리스 태그부터의 커밋으로 노트를 만들려면 전체 기록과 태그가 필요해요.
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "${{ steps.version.outputs.tag }} is already released"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update notes of existing release
        if: steps.check.outputs.exists == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          ./scripts/release-notes.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.tag }}" > notes.md
          gh release edit "${{ steps.version.outputs.tag }}" --notes-file notes.md

      - name: Build
        if: steps.check.outputs.exists != 'true'
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent build/DotDesk.app "build/DotDesk-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-notes.sh "${{ steps.version.outputs.version }}" "$GITHUB_SHA" > notes.md
          gh release create "${{ steps.version.outputs.tag }}" \
            "build/DotDesk-${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "DotDesk ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
